<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent City — Office</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/style.css">
<style>
html, body { background: #1c1622; }
canvas#office { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
#tags { position: fixed; inset: 0; pointer-events: none; z-index: 1; overflow: hidden; }
/* name tags + bubbles are painted on the canvas from cached bitmaps; these transparent pills are the click targets */
#tags .w { position: absolute; left: 0; top: 0; will-change: transform; }
#tags .tag { pointer-events: auto; cursor: pointer; opacity: 0; border-radius: 999px; overflow: hidden; font-size: 1px; color: transparent; }
#loading { position: fixed; inset: 0; display: grid; place-items: center; font: 500 13px var(--sans); color: var(--dim); }
</style>
</head>
<body>
<div id="loading">Opening the office…</div>
<canvas id="office" aria-label="Agent City office: each bot is a worker at a desk"></canvas>
<div id="tags"></div>
<div id="kpi" role="status" aria-live="polite"></div>
<div id="title">Agent City<small id="clock"></small><small id="asof"></small></div>
<div id="ctrl"><button class="m" id="music" aria-pressed="false" title="Ambient piano (generated)">♪ music off</button><a class="m" href="/logout">sign out</a></div>
<div id="card" role="dialog" aria-label="Worker card"></div>
<ul id="roster" class="sr" aria-label="Workers"></ul>
<div id="fps" hidden></div>
<script>window.AC = window.AC || {};</script><script src="/audio.js"></script>
<script type="module" src="/office2d/main.js"></script>
</body></html>
